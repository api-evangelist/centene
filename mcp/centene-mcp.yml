candidate_tools:
  - name: find_provider
    description: >-
      Search Centene's in-network provider directory by name, specialty, location or affiliation.
      Anonymous - no credential required.
    backing_api: FHIR - Provider Directory
    rest:
      - Practitioner_Search
    endpoint: GET https://iopc-pd.api.centene.com/iopc/pd/fhir/providerdirectory/Practitioner
    auth: none
    consequence: read
  - name: find_practitioner_role
    description: Retrieve a practitioner's roles, networks and locations from the PDEX Plan Net directory.
    backing_api: FHIR - Provider Directory
    rest:
      - PractitionerRole_Search
    auth: none
    consequence: read
  - name: find_location
    description: Search directory locations by city, address or organization.
    backing_api: FHIR - Provider Directory
    rest:
      - Location_Search
    auth: none
    consequence: read
  - name: find_organization
    description: Search provider organizations and their affiliations.
    backing_api: FHIR - Provider Directory
    rest:
      - Organization_Search
      - OrganizationAffiliation_Search
    auth: none
    consequence: read
  - name: list_insurance_plans
    description: List the insurance plans and networks published in the directory.
    backing_api: FHIR - Provider Directory
    rest:
      - InsurancePlan_Search
    auth: none
    consequence: read
  - name: get_member_coverage
    description: Read the authorizing member's coverage records.
    backing_api: FHIR - Patient Access
    scopes: ['patient/Coverage.read']
    auth: oauth (SMART standalone launch, member consent)
    consequence: read-phi
  - name: get_member_claims
    description: >-
