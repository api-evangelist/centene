    backing_api: FHIR - Patient Access
    scopes: ['patient/ExplanationOfBenefit.read']
    auth: oauth (SMART standalone launch, member consent)
    consequence: read-phi
  - name: get_member_medications
    description: Read the authorizing member's medication requests and formulary information.
    backing_api: FHIR - Patient Access
    scopes: ['patient/MedicationRequest.read', 'patient/Medication.read']
    auth: oauth (SMART standalone launch, member consent)
    consequence: read-phi
  - name: get_member_clinical_record
    description: >-
      Read the authorizing member's US Core clinical resources - conditions, observations,
