    auth: oauth client_credentials (audience ewsext)
    consequence: read
  - name: get_provider_demographics
    description: Read Provider RTR demographic records for an authorized payer partner.
    backing_api: Provider RTR - Demographics API
    auth: oauth client_credentials (audience prtrdemographic)
    consequence: read
excluded_from_candidate:
  - api: LWC EDI CORE REAL TIME SERVICE
    reason: >-
      Seven X12 transaction-submission operations with no idempotency and no reversal path. A
      correctly cautious MCP surface would not expose these as agent tools without a
      human-confirmation step Centene does not provide.
  - api: CCM Communication
    reason: Insert/update/merge writes with no documented undo.
  - api: REST Admin API / External Kafka API
    reason: >-
      Confluent's Kafka REST Admin contract for Centene's internal KaaS clusters, on hostnames
      that do not resolve publicly. Not a consumable external surface.
recommendation: >-
  The Provider Directory alone is a ready-made, zero-credential agent surface - 200-record paged
  FHIR search over practitioners, locations, organizations and plans, already public, already
  live. It is the single highest-leverage MCP server Centene could ship, and it would carry no PHI
  and require no consent flow.
