      type: object
      properties:
        exclude:
          type: object
          allOf:
          - $ref: '#/components/schemas/Condition'
          - type: object
            required:
            - criteria
            properties:
              criteria:
                type: array
                maxItems: 1
                items:
                  $ref: '#/components/schemas/Condition'
