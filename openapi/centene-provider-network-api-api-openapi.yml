openapi: 3.2.0
info:
  description: 'These endpoints allow users to retrieve information on different datasets that originated from the Centenes'' Provider source system.


    All endpoints available on this micro-service are http-based GET operations and produce a JSON response.'
  title: Provider RTR Demographics Provider Network API
  version: '2.0'
servers:
- description: Development environment
  url: https://dev-int-api-gw.centene.com/provider-rtr/demographics/
- description: Test environment
  url: https://test-int-api-gw.centene.com/provider-rtr/demographics/
- description: Production environment
  url: https://api-gateway-01.centene.com/provider-rtr/demographics/
security:
- oauth2:
  - resource.READ
tags:
- description: 'RESTful API endpoints for search Providers'' network related information.


    More information can be found on the corresponding Alation page: https://alation.centene.com/table/538089/'
  name: Provider-Network-API
paths:
  /provRTR/v2/provider/network:
    get:
      description: Look up provider location networks matching the search criteria. At least npi, tin, or affiliationNumber are required to use
      operationId: GetProviderNetworkPlan
      parameters:
      - description: Providers' NPI Number. Separate each NPI with a comma.
        in: query
        name: npi
        schema: {}
      - description: Providers' TIN Number. Separate each TIN with a comma.
        in: query
        name: tin
        schema: {}
      - description: Provider Location's Affiliation Number.
        in: query
        name: affiliationNumber
        schema:
          type: string
      - description: Provider Location's Affiliation Group Practice Number. At least npi, tin, or affiliationNumber required to use.
        in: query
        name: groupPracticeNumber
        schema:
          type: string
      - description: Provider Location's Affiliation Sub Program. At least npi, tin, or affiliationNumber required to use.
        in: query
        name: subProgram
        schema:
          type: string
      - description: The page of results to return.
        in: query
        name: page
        schema:
          type: string
      - description: The number of Provider's matching the search criteria to return per page.
        in: query
        name: pageCount
        schema:
          type: string
      - description: Select fields to display. Separate each field with a comma.
        in: query
        name: select
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProviderResponse'
          description: Valid response
        '400':
          description: Invalid Search Criteria
        '403':
          description: Unauthorized Request Error. In this scenario, please ensure your teams' authorization key is correctly configured in the calling application. If problem persists, please contact IT-POTS-Team@CENTENE.COM (cc STL_Provider_RTR_Support@CENTENE.COM).
        '500':
          description: Internal Server Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
        '504':
          description: Gateway Timeout Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
      tags:
      - Provider-Network-API
      summary: Get provider network plan
      x-summary-source: derived
