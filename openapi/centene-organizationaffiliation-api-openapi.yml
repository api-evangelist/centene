        schema:
          type: string
      - name: participating-organization
        in: query
        description: The organization that provides services to the primary organization
        schema:
          type: string
      - name: primary-organization
        in: query
        description: The organization that receives the services from the participating organization
        schema:
          type: string
      - name: role
        in: query
        description: Definition of the role the participatingOrganization plays
        schema:
          type: string
      - name: service
        in: query
        description: Healthcare services provided through the role
        schema:
          type: string
      - name: specialty
        in: query
        description: Specific specialty of the participatingOrganization in the context of the role
        schema:
          type: string
      - name: _id
        in: query
        description: The ID of the resource
        schema:
          type: string
      - name: endpoint
        in: query
        description: Search for OrganizationAffiliations with specified endpoint
        schema:
          type: string
      - name: _include
        in: query
        schema:
          type: string
          x-consoleDefault: application/json
        x-consoleDefault: application/json
      - name: _source
        in: query
        schema:
          type: string
      - name: _next
        in: query
        schema:
          type: string
      - name: _page
        in: query
        schema:
          type: number
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/OrganizationAffiliation-search'
        '400':
          description: Bad request
          content:
            '*/*':
              example:
