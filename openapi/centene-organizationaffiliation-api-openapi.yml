          - severity
          - code
          - details
          type: object
          properties:
            severity:
              minLength: 1
              type: string
            code:
              minLength: 1
              type: string
            details:
              minLength: 1
              type: string
    OrganizationAffiliation-search:
      required:
      - entry
      - id
      - link
      - meta
      - resourceType
      - total
      - type
      type: object
      properties:
        resourceType:
          minLength: 1
          type: string
        id:
