openapi: 3.2.0
info:
  description: 'These endpoints allow users to retrieve information on different datasets that originated from the Centenes'' Provider source system.


    All endpoints available on this micro-service are http-based GET operations and produce a JSON response.'
  title: Provider RTR Demographics Practitioner Date API
  version: '2.0'
servers:
- description: Development environment
  url: https://dev-int-api-gw.centene.com/provider-rtr/demographics/
- description: Test environment
  url: https://test-int-api-gw.centene.com/provider-rtr/demographics/
- description: Production environment
  url: https://api-gateway-01.centene.com/provider-rtr/demographics/
security:
- oauth2:
  - resource.READ
tags:
- description: 'RESTful API endpoints for search Practitioners'' date related information.


    More information can be found on the corresponding Alation page: https://alation.centene.com/table/538096/'
  name: Practitioner-Date-API
paths:
  /businessfunction/v1/practitioner/date:
    get:
      description: 'Find Active Practitioners given a combination of different dates at different levels, such as: location, network location, network, affiliations. At least npi, tin, affiliationNumber, affiliationMedicaidId, affiliationMedicareId, provNpi, firstName or lastName are required to use'
      operationId: GetPractitionersByDate
      parameters:
      - description: Practitioner's NPI Number.
        in: query
        name: npi
        schema:
          type: string
      - description: Practitioner Locations TIN.
        in: query
        name: tin
        schema:
          type: string
      - description: Practitioner Locations Affiliation Number.
        in: query
        name: affiliationNumber
        schema:
          type: string
      - description: NPI for the Provider operating the Practitioner Location.
        in: query
        name: provNpi
        schema:
          type: string
      - description: Practioners' affiliation medicaid id.
        in: query
        name: affiliationMedicaidId
        schema:
          type: string
      - description: Practioners' affiliation medicare id.
        in: query
        name: affiliationMedicareId
        schema:
          type: string
      - description: Practioners' network business unit code.
        in: query
        name: businessUnitCode
        schema:
          type: string
      - description: Practioners' first name. At least one valid 'npi', 'tin', 'provNpi', 'affiliationNumber', 'affiliationMedicaidId', or 'affiliationMedicareId' is required to use.
        in: query
        name: firstName
        schema:
          type: string
      - description: Practioners' last name. At least one valid 'npi', 'tin', 'provNpi', 'affiliationNumber', 'affiliationMedicaidId', or 'affiliationMedicareId' is required to use.
        in: query
        name: lastName
        schema:
          type: string
      - description: Practioners' network status.
        in: query
        name: networkStatus
        schema:
          type: string
      - description: Practioners' affiliations status.
        in: query
        name: affilStatus
        schema:
          type: string
      - description: Practioners' carrier NetworkId.
        in: query
        name: carrierNetworkId
        schema:
          type: string
      - description: allows to select the location date level to be considered for different date inputs.
        in: query
        name: useLocationDate
        schema:
          type: boolean
      - description: allows to select the network location date level to be considered for different date inputs.
        in: query
        name: useNetworkLocationDate
        schema:
          type: boolean
      - description: allows to select the network date level to be considered for different date inputs.
        in: query
        name: useNetworkDate
        schema:
          type: boolean
      - description: allows to select the affiliation date level to be considered for different date inputs.
        in: query
        name: useAffiliationDate
        schema:
          type: boolean
      - description: startDateOnOrAfter is to be used to look up choosen date levels (i.e. location, network location, network, and/or affiliation) for start dates on or after (in the future).
        in: query
        name: startDateOnOrAfter
        schema:
          type: string
      - description: endDateOnOrBefore is to be used to look up choosen date levels (i.e. location, network location, network, and/or affiliation) for start dates on or before (in the past).
        in: query
        name: endDateOnOrBefore
        schema:
          type: string
      - description: dateOnOrInStartEndDateSpan is to be used to check that the it is inclusively between the choosen date levels (i.e. location, network location, network, and/or affiliation).
        in: query
        name: dateOnOrInStartEndDateSpan
        schema:
          type: string
      - description: The page of results to return.
        in: query
        name: page
        schema:
          type: string
      - description: The number of practitioners matching the search criteria to return per page.
        in: query
        name: pageCount
        schema:
          type: string
      - description: Select fields to display. Separate each field with a comma.
        in: query
        name: select
        schema: {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PractitionerResponse'
          description: Valid response
        '400':
          description: Invalid Search Criteria
        '403':
          description: Unauthorized Request Error. In this scenario, please ensure your teams' authorization key is correctly configured in the calling application. If problem persists, please contact IT-POTS-Team@CENTENE.COM (cc STL_Provider_RTR_Support@CENTENE.COM).
        '500':
          description: Internal Server Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
        '504':
          description: Gateway Timeout Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
      tags:
      - Practitioner-Date-API
      summary: Get practitioners by date
      x-summary-source: derived
  /businessfunction/v1/practitioner/date/health:
    get:
      description: Health Check
      operationId: GetPractitionerDateHealth
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthResponse'
          description: Valid response
        '403':
          description: Unauthorized Request Error. In this scenario, please ensure your teams' authorization key is correctly configured in the calling application. If problem persists, please contact IT-POTS-Team@CENTENE.COM (cc STL_Provider_RTR_Support@CENTENE.COM).
        '424':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/healthResponse'
          description: Unable to establish connection with MongoDB server.
        '500':
          description: Internal Server Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
        '504':
          description: Gateway Timeout Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
      tags:
      - Practitioner-Date-API
      summary: Get practitioner date health
      x-summary-source: derived
  /businessfunction/v1/practitioner/date/version:
    get:
      description: Version Information
      operationId: GetPractitionerDateVersion
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/versionResponse'
          description: Valid response
        '403':
          description: Unauthorized Request Error. In this scenario, please ensure your teams' authorization key is correctly configured in the calling application. If problem persists, please contact IT-POTS-Team@CENTENE.COM (cc STL_Provider_RTR_Support@CENTENE.COM).
        '500':
          description: Internal Server Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
        '504':
          description: Gateway Timeout Error. In this scenario, please contact STL_Provider_RTR_Support@CENTENE.COM.
      tags:
      - Practitioner-Date-API
      summary: Get practitioner date version
      x-summary-source: derived
