openapi: 3.2.0
info:
  title: Provider Directory Endpoint API
  description: Provider directory endpoints for FHIR resources
  version: '1.0'
servers:
- url: https://dev-int-api-gw.centene.com/fhir/v4/providerdirectory
tags:
- name: Endpoint
paths:
  /Endpoint/{id}:
    get:
      tags:
      - Endpoint
      summary: Read the current state of the resource
      operationId: readEndpoint
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Endpoint'
        '400':
          description: Bad request
          content:
            '*/*':
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: invalid
                  details:
                    text: Invalid or badly formed Endpoint ID .
              schema:
                $ref: '#/components/schemas/GeneralError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Unauthorized
                  details:
                    text: You are not authorized to view this Endpoint.
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: forbidden
                  details:
                    text: You are not allowed to view this Endpoint.
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Not Found
                  details:
                    text: No Endpoint found with the provided ID.
        '500':
          description: InternalServerError
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: fatal
                  code: exception
                  details:
                    text: Internal server error. Please try again later
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Too Many Requests
                  details:
                    text: Too Many Requests for Endpoint with the provided ID.
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Not Implemented
                  details:
                    text: The request for Endpoint is Not Implemented
        '502':
          description: Bad gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Bad gateway
                  details:
                    text: Bad gateway
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Service Unavailable
                  details:
                    text: Service Unavailable
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Gateway Timeout
                  details:
                    text: Gateway Timeout
  /Endpoint:
    get:
      tags:
      - Endpoint
      summary: Search all resources of type Endpoint based on a set of criteria
      operationId: searchEndpoint
      parameters:
      - name: _lastUpdated
        in: query
        schema:
          type: string
          format: date
      - name: _id
        in: query
        description: The ID of the resource
        schema:
          type: string
      - name: organization
        in: query
        description: The organization that provides this Endpoint Service
        schema:
          type: string
      - name: _include
        in: query
        schema:
          type: string
          x-consoleDefault: application/json
        x-consoleDefault: application/json
      responses:
        '200':
          description: Success
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/Endpoint-search'
        '400':
          description: Bad request
          content:
            '*/*':
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: invalid
                  details:
                    text: Invalid or badly formed Endpoint ID .
              schema:
                $ref: '#/components/schemas/GeneralError'
        '401':
          description: Unauthorized
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Unauthorized
                  details:
                    text: You are not authorized to view this Endpoint.
        '403':
          description: Forbidden
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: forbidden
                  details:
                    text: You are not allowed to view this Endpoint.
        '404':
          description: Not Found
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Not Found
                  details:
                    text: No Endpoint found with the provided ID.
        '500':
          description: InternalServerError
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: fatal
                  code: exception
                  details:
                    text: Internal server error. Please try again later
        '429':
          description: Too Many Requests
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Too Many Requests
                  details:
                    text: Too Many Requests for Endpoint with the provided ID.
        '501':
          description: Not Implemented
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Not Implemented
                  details:
                    text: The request for Endpoint is Not Implemented
        '502':
          description: Bad gateway
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Bad gateway
                  details:
                    text: Bad gateway
        '503':
          description: Service Unavailable
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Service Unavailable
                  details:
                    text: Service Unavailable
        '504':
          description: Gateway Timeout
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GeneralError'
              example:
                resourceType: OperationOutcome
                issue:
                - severity: error
                  code: Gateway Timeout
                  details:
                    text: Gateway Timeout
      security:
      - Basic: []
components:
  schemas:
    Endpoint-search:
      required:
      - entry
      - id
      - link
      - meta
      - resourceType
      - total
      - type
      type: object
      properties:
        resourceType:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        meta:
          required:
          - lastUpdated
          type: object
          properties:
            lastUpdated:
              minLength: 1
              type: string
        type:
          minLength: 1
          type: string
        total:
          type: number
        link:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            required:
            - relation
            - url
            type: object
            properties:
              relation:
                minLength: 1
                type: string
              url:
                minLength: 1
                type: string
        entry:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            required:
            - fullUrl
            type: object
            properties:
              fullUrl:
                minLength: 1
                type: string
              resource:
                required:
                - active
                - category
                - extension
                - id
                - language
                - location
                - meta
                - providedBy
                - resourceType
                - specialty
                - text
                type: object
                properties:
                  resourceType:
                    minLength: 1
                    type: string
                  id:
                    minLength: 1
                    type: string
                  meta:
                    required:
                    - lastUpdated
                    - profile
                    type: object
                    properties:
                      lastUpdated:
                        minLength: 1
                        type: string
                      profile:
                        type: array
                        items:
                          type: object
                          properties: {}
                  language:
                    minLength: 1
                    type: string
                  text:
                    required:
                    - div
                    - status
                    type: object
                    properties:
                      status:
                        minLength: 1
                        type: string
                      div:
                        minLength: 1
                        type: string
                  extension:
                    minItems: 1
                    uniqueItems: true
                    type: array
                    items:
                      required:
                      - url
                      type: object
                      properties:
                        extension:
                          minItems: 1
                          uniqueItems: true
                          type: array
                          items:
                            required:
                            - url
                            type: object
                            properties:
                              url:
                                minLength: 1
                                type: string
                              valueCodeableConcept:
                                required:
                                - coding
                                type: object
                                properties:
                                  coding:
                                    minItems: 1
                                    uniqueItems: true
                                    type: array
                                    items:
                                      required:
                                      - code
                                      - system
                                      type: object
                                      properties:
                                        system:
                                          minLength: 1
                                          type: string
                                        code:
                                          minLength: 1
                                          type: string
                        url:
                          minLength: 1
                          type: string
                  active:
                    type: boolean
                  providedBy:
                    required:
                    - reference
                    type: object
                    properties:
                      reference:
                        minLength: 1
                        type: string
                  category:
                    minItems: 1
                    uniqueItems: true
                    type: array
                    items:
                      type: object
                      properties:
                        coding:
                          minItems: 1
                          uniqueItems: true
                          type: array
                          items:
                            required:
                            - code
                            - system
                            type: object
                            properties:
                              system:
                                minLength: 1
                                type: string
                              code:
                                minLength: 1
                                type: string
                  specialty:
                    minItems: 1
                    uniqueItems: true
                    type: array
                    items:
                      type: object
                      properties:
                        coding:
                          minItems: 1
                          uniqueItems: true
                          type: array
                          items:
                            required:
                            - code
                            - display
                            - system
                            type: object
                            properties:
                              system:
                                minLength: 1
                                type: string
                              code:
                                minLength: 1
                                type: string
                              display:
                                minLength: 1
                                type: string
                  location:
                    minItems: 1
                    uniqueItems: true
                    type: array
                    items:
                      required:
                      - reference
                      type: object
                      properties:
                        reference:
                          minLength: 1
                          type: string
      description: ''
    Endpoint:
      required:
      - active
      - category
      - extension
      - id
      - language
      - location
      - meta
      - providedBy
      - resourceType
      - specialty
      - text
      type: object
      properties:
        resourceType:
          minLength: 1
          type: string
        id:
          minLength: 1
          type: string
        meta:
          required:
          - lastUpdated
          - profile
          type: object
          properties:
            lastUpdated:
              minLength: 1
              type: string
            profile:
              type: array
              items:
                type: object
                properties: {}
        language:
          minLength: 1
          type: string
        text:
          required:
          - div
          - status
          type: object
          properties:
            status:
              minLength: 1
              type: string
            div:
              minLength: 1
              type: string
        extension:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            required:
            - url
            type: object
            properties:
              extension:
                minItems: 1
                uniqueItems: true
                type: array
                items:
                  required:
                  - url
                  type: object
                  properties:
                    url:
                      minLength: 1
                      type: string
                    valueCodeableConcept:
                      required:
                      - coding
                      type: object
                      properties:
                        coding:
                          minItems: 1
                          uniqueItems: true
                          type: array
                          items:
                            required:
                            - code
                            - system
                            type: object
                            properties:
                              system:
                                minLength: 1
                                type: string
                              code:
                                minLength: 1
                                type: string
              url:
                minLength: 1
                type: string
        active:
          type: boolean
        providedBy:
          required:
          - reference
          type: object
          properties:
            reference:
              minLength: 1
              type: string
        category:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: object
            properties:
              coding:
                minItems: 1
                uniqueItems: true
                type: array
                items:
                  required:
                  - code
                  - system
                  type: object
                  properties:
                    system:
                      minLength: 1
                      type: string
                    code:
                      minLength: 1
                      type: string
        specialty:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            type: object
            properties:
              coding:
                minItems: 1
                uniqueItems: true
                type: array
                items:
                  required:
                  - code
                  - display
                  - system
                  type: object
                  properties:
                    system:
                      minLength: 1
                      type: string
                    code:
                      minLength: 1
                      type: string
                    display:
                      minLength: 1
                      type: string
        location:
          minItems: 1
          uniqueItems: true
          type: array
          items:
            required:
            - reference
            type: object
            properties:
              reference:
                minLength: 1
                type: string
      description: ''
    GeneralError:
      required:
      - resourceType
      - issue
      type: object
      properties:
        resourceType:
          minLength: 1
          type: string
        issue:
          required:
          - severity
          - code
          - details
          type: object
          properties:
            severity:
              minLength: 1
              type: string
            code:
              minLength: 1
              type: string
            details:
              minLength: 1
              type: string
  securitySchemes:
    Basic:
      type: http
      scheme: basic
