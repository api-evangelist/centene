provider: Centene
providerId: centene
note: >-
  Read from the partner portal's own API catalogue, which is served anonymously as JSON and
  carries per-API version, creation and last-updated timestamps. Centene publishes no changelog,
  no deprecation policy, no Sunset/Deprecation header commitment, no SLA and no status page - all
  four were searched for and all four are genuinely absent, which is recorded here rather than
  omitted.
versioning:
  scheme: mixed
  note: >-
    There is no single versioning convention. The FHIR APIs version against the FHIR release
    (4.0.1) and carry the version in neither path nor header. Provider RTR PDEX versions in the
    path (/v1/). Product Mapping versions in both the path (/v2/) and the API name. The remaining
    APIs carry a free-text `version` string in the catalogue only ("Version 1.0.0", "1.1", "2.0",
    "0.0.6") that is not expressed anywhere in the contract.
  in_path: partial
  in_header: false
  in_media_type: false
  content_negotiation: false
status_page:
  published: false
  probed:
