      status: 0
      note: Does not resolve.
    - url: https://status.partners.centene.com
      status: 0
      note: Does not resolve.
    - url: https://centene.statuspage.io
      status: 200
      note: >-
        Not a Centene status page. Redirects to atlassian.com/software/statuspage, and
        /api/v2/status.json 302s to statuspage.io - the subdomain is unclaimed.
deprecation_policy:
  published: false
  sunset_header: false
  deprecation_header: false
  note: >-
    No deprecation or sunset policy is published on the portal, and no spec marks any operation
    `deprecated: true` across all 185 operations. For a regulator-mandated API this matters more
    than usual: a third-party app built against the Patient Access API has no published notice
    period if an endpoint changes.
deprecated_operations:
  count: 0
  source: openapi/ (185 operations scanned, none carry deprecated:true)
sla:
  published: false
  note: >-
    No uptime, latency or support-response commitment is published to third-party developers.
    CMS-mandated availability obligations exist in regulation but Centene does not restate them
    as an API SLA.
