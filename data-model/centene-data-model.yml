note: >-
  Derived from the components.schemas of Centene's published specs and cross-checked against the
  live FHIR CapabilityStatement. The important structural fact is that Centene does not have one
  data model - it has two, and they describe the same real-world providers in incompatible ways.
  The FHIR estate speaks HL7 R4 resources with FHIR reference semantics. The Provider RTR
  Demographics and PCES estate speaks a bespoke Centene provider model with 151 and 85 schemas
  respectively and no FHIR mapping published between them.
