cross_domain_gaps:
  - >-
    There is no published crosswalk between the FHIR directory `Practitioner` and the Provider RTR
    Demographics provider record, even though both describe the same physician. An integrator
    consuming both must join on NPI by hand.
  - >-
    PCES CarrierEntity has no declared relationship to either FHIR Organization or the RTR
    business-entity model.
  - >-
    Product Mapping V2 returns networks and counties for an address but does not reference
    InsurancePlan ids from the FHIR directory.
identifiers:
