providerId: centene
note: >-
  Centene publishes a real sandbox for the CMS Patient Access API, documented in the Getting
  Started guide attached to its own catalogue entry. Every value below is quoted from that
  document - nothing here was invented, and the test identities are Centene's own published
  fixtures, not real members.
sandbox:
  published: true
  separate_environment: true
  authorization_server: https://sandbox.entrykeyid.com
  authorize_endpoint: https://sandbox.entrykeyid.com/as/authorization.oauth2
  token_endpoint: https://sandbox.entrykeyid.com/as/token.oauth2
  api_host: https://iopc-sand.test.api.centene.com/iopc/sand
  api_host_source: >-
    hostServers[serverName=Sandbox] on the FHIR - Patient Access entry in the partner portal
    catalogue.
  production_host: https://iopc-pa.api.centene.com/iopc/pa
mode_separation:
  style: separate hostname and separate authorization server
  key_prefixes: none
  note: >-
    Centene does not use test-vs-live key prefixes. Sandbox and production are distinguished by
    hostname (iopc-sand.test.api.centene.com vs iopc-pa.api.centene.com) and by issuer
    (sandbox.entrykeyid.com vs sso.entrykeyid.com). A credential cannot be visually identified as
    test or live, which is a real hazard for an agent holding both.
test_identities:
  type: sandbox member logins
  count: 6
  published_verbatim: true
  note: >-
    Centene publishes six sandbox member accounts with a shared password so a developer can walk
    the SMART standalone launch end to end. These are the provider's own published fixtures.
  users:
    - username: CNCTESTTPA001
      given: JAMES
      family: ETETEST
      patient_uuid: '302'
    - username: CNCTESTTPA002
      given: JAMES
      family: ETETEST1
      patient_uuid: '352'
    - username: CNCTESTTPA003
      given: JAMES
