      patient_uuid: '361'
    - username: CNCTESTTPA004
      given: JAMES
      family: ETETEST3
      patient_uuid: '370'
    - username: CNCTESTTPA005
      given: JAMES
      family: ETETEST4
      patient_uuid: '375'
    - username: CNCTESTTPA006
      given: JAMES
      family: ETETEST5
      patient_uuid: '381'
  password_note: >-
    A single shared sandbox password is published alongside the six accounts in Centene's guide.
    Deliberately not mirrored here - it is a credential-shaped string, it is one fetch away at the
    source URL, and copying it into the catalogue adds nothing an integrator needs.
flow:
  - step: 1
    action: Register an application through the partner portal to receive clientId, clientSecret and redirect_uri.
    url: https://partners.centene.com/applicationDeveloper-form
  - step: 2
    action: >-
      Open https://sandbox.entrykeyid.com/as/authorization.oauth2?client_id={clientId}&redirect_uri={redirectUri}&response_type=code
      in a browser and sign in as one of the six sandbox members.
  - step: 3
    action: Read the authorization code from the redirect URL query string. It is single-use.
  - step: 4
    action: >-
      POST to https://sandbox.entrykeyid.com/as/token.oauth2 with Authorization
      "Basic base64(clientId:clientSecret)", Content-Type application/json, and a JSON body of
      code, grant_type=authorization_code and redirect_uri.
  - step: 5
    action: >-
      Call the sandbox FHIR host with the bearer token. The token response carries a `patient`
      claim naming the FHIR Patient logical id the token is scoped to.
  - step: 6
    action: >-
      Exchange the refresh_token at the same endpoint with grant_type=refresh_token when the
      3600-second access token expires.
public_no_signup_surface:
  note: >-
    The FHIR Provider Directory needs no sandbox and no registration at all - it is anonymous in
    production. It is the fastest way to see real Centene data:
    GET https://iopc-pd.api.centene.com/iopc/pd/fhir/providerdirectory/Practitioner?family=SMITH
    returns HTTP 200 and a FHIR searchset Bundle with no credential.
  verified: '2026-09-07'
